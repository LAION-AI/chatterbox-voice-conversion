[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterbox-voice-conversion"
version = "0.1.0"
description = "Voice conversion pipeline built on Resemble AI's Chatterbox S3Gen model"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "LAION e.V."},
]

dependencies = [
    "chatterbox-tts>=0.1.1",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/LAION-AI/chatterbox-voice-conversion"
Repository = "https://github.com/LAION-AI/chatterbox-voice-conversion"
Issues = "https://github.com/LAION-AI/chatterbox-voice-conversion/issues"

[tool.setuptools.packages.find]
include = ["chatterbox_vc*"]
